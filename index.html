<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="오늘 중요한 기술 정보를 프로젝트와 AI 지식으로 연결하는 Oh My Feed MVP"
    />
    <title>Oh My Feed — 새 소식과 내 피드</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 fill=%22%23172033%22/><path d=%22M8 9h16v3H8zm0 6h11v3H8zm0 6h14v3H8z%22 fill=%22white%22/></svg>" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#today" aria-label="Oh My Feed 홈">
          <span class="brand-mark" aria-hidden="true">OMF</span>
          <span>Oh My Feed</span>
        </a>
        <nav class="feed-modes" aria-label="피드 보기">
          <button class="mode-button" type="button" data-mode="browse">둘러보기</button>
          <button class="mode-button" type="button" data-mode="personalized">내 피드</button>
        </nav>
        <div class="project-chip" id="project-chip" hidden>
          <span class="project-dot" aria-hidden="true"></span>
          <span id="project-name">프로젝트 불러오는 중</span>
        </div>
      </header>

      <main>
        <section class="brief" id="today" aria-labelledby="brief-title">
          <div class="brief-copy">
            <p class="eyebrow" id="brief-eyebrow">2026.09.01 · LATEST</p>
            <h1 id="brief-title">새로 나온 소식</h1>
            <p class="brief-description" id="brief-description">AI·개발 분야의 새 글을 한곳에서 확인하세요.</p>
          </div>
          <div class="reduction" id="feed-summary" aria-label="피드 요약">
            <div><strong id="summary-primary">—</strong><span id="summary-primary-label">새 글</span></div>
            <span class="reduction-arrow" id="summary-arrow" aria-hidden="true">·</span>
            <div><strong id="summary-secondary">—</strong><span id="summary-secondary-label">카테고리</span></div>
          </div>
        </section>

        <section class="workspace" aria-label="피드와 글 상세">
          <div class="queue-panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow" id="queue-eyebrow">LATEST FEED</p>
                <h2 id="queue-title">새 글</h2>
              </div>
              <button class="text-button" id="reset-button" type="button">처음부터</button>
            </div>
            <div id="feed-list" class="feed-list" aria-live="polite"></div>
            <div id="empty-feed" class="empty-state" hidden>
              <strong>표시할 글이 없습니다.</strong>
              <span>숨긴 글은 처음부터를 누르면 다시 볼 수 있습니다.</span>
            </div>
          </div>

          <aside class="detail-panel" id="detail-panel" aria-live="polite">
            <div class="detail-placeholder">
              <span class="placeholder-line"></span>
              <p id="detail-hint">글을 선택하면<br />내용을 확인할 수 있습니다.</p>
            </div>
          </aside>
        </section>

        <section class="knowledge-section" id="knowledge" aria-labelledby="knowledge-title" hidden>
          <div class="knowledge-heading">
            <p class="eyebrow">APPROVED KNOWLEDGE</p>
            <h2 id="knowledge-title">내 AI가 사용할 수 있는 지식</h2>
            <p>사람이 승인한 내용만 답변의 근거가 됩니다.</p>
          </div>
          <div class="knowledge-stage">
            <div id="knowledge-ledger" class="knowledge-ledger">
              <p class="muted">아직 승인한 지식이 없습니다.</p>
            </div>
            <form id="ask-form" class="ask-box">
              <label for="ask-input">내 지식에 묻기</label>
              <div class="ask-control">
                <input
                  id="ask-input"
                  value="최근 Orbit 설계에 반영할 변화가 있어?"
                  aria-describedby="ask-help"
                />
                <button type="submit">묻기</button>
              </div>
              <p id="ask-help">승인한 지식만 사용합니다.</p>
              <div id="answer" class="answer" hidden></div>
            </form>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
